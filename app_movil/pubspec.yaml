name: essence_movil
description: App móvil del administrador de Essence Don Aire (proceso de ventas).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Peticiones HTTP a la API
  http: ^1.2.2
  # Guarda el token de sesión en el teléfono
  shared_preferences: ^2.3.2
  # Formato de dinero y fechas en español
  intl: ">=0.19.0 <0.21.0"
  # Factura y reportes en PDF, y el menú para compartirlos o imprimirlos
  pdf: ^3.11.1
  printing: ^5.13.4
  # Abrir WhatsApp, llamadas y links de pago
  url_launcher: ^6.3.1
  # Compartir texto (link de pago, estado de cuenta)
  share_plus: ^10.1.4
  # Tomar o elegir la foto de un producto
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
